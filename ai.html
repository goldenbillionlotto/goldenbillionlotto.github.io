<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBL AI Assistant</title>
<style>
    *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
    body{ background:linear-gradient(135deg,#0b1020,#13294b,#1f5fbf); color:white; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
    .container{ width:100%; max-width:900px; background:rgba(255,255,255,.08); backdrop-filter:blur(12px); border-radius:25px; padding:40px; box-shadow:0 20px 50px rgba(0,0,0,.4); }
    h1{ font-size:42px; margin-bottom:15px; }
    p{ font-size:18px; opacity:.9; margin-bottom:30px; line-height:1.6; }
    input{ width:100%; padding:18px; border:none; border-radius:15px; font-size:18px; outline:none; margin-bottom:20px; color:black; }
    button{ background:#4da3ff; color:white; border:none; padding:18px 35px; border-radius:15px; font-size:18px; cursor:pointer; transition:.3s; margin-top:10px; }
    button:hover{ transform:scale(1.05); }
    .answer{ margin-top:30px; background:rgba(255,255,255,.08); padding:20px; border-radius:15px; font-size:18px; line-height:1.8; min-height:60px; }
    .footer{ margin-top:35px; font-size:14px; opacity:.7; text-align:center; }
</style>
</head>
<body>

<div class="container">
    <h1>🤖 GBL AI Assistant (Beta)</h1>
    <p>Welcome to the first AI assistant for the Golden Billion Lotto ecosystem. Ask anything about GBL, our vision, roadmap, whitepaper, or community.</p>

    <!-- تم إضافة خاصية الاستجابة لزر Enter هنا -->
    <input id="question" placeholder="Ask GBL AI..." onkeydown="if(event.key==='Enter') askAI()">

    <div style="margin-top:20px;margin-bottom:20px;">
        <p style="margin-bottom:10px;font-weight:bold;">✨ Popular Questions</p>
        <button onclick="quickQuestion('What is GBL?')">What is GBL?</button>
        <button onclick="quickQuestion('Explain the Whitepaper')">Whitepaper</button>
        <button onclick="quickQuestion('Why GBL?')">Why GBL?</button>
        <button onclick="quickQuestion('How do I buy GBL?')">How to Buy</button>
        <button onclick="quickQuestion('What is the roadmap?')">Roadmap</button>
    </div>

    <button onclick="askAI()">Ask GBL AI</button>

    <div class="answer" id="answer">Ask your first question above.</div>

    <div class="footer">Golden Billion Lotto © 2026</div>
</div>

<script>
function askAI(){
    let q = document.getElementById("question").value.toLowerCase();
    let answer = "";

    if(q.includes("what is gbl")){
        answer = "Golden Billion Lotto (GBL) is a community-driven Solana project focused on transparency, long-term growth, AI-powered utilities, and building real value.";
    } else if(q.includes("roadmap")){
        answer = "Our roadmap focuses on growing the community, expanding AI utilities, increasing transparency, and continuously improving the ecosystem.";
    } else if(q.includes("whitepaper")){
        answer = "Our Whitepaper explains the vision, token concept, AI direction, and long-term development strategy of GBL.";
    } else if(q.includes("solana")){
        answer = "GBL is built on Solana because it offers fast transactions, low fees, and excellent scalability.";
    } else if(q.includes("vision")){
        answer = "Our vision is to create one of the strongest community-driven AI ecosystems on Solana while continuously delivering real products.";
    } else if(q.includes("buy")){
        answer = "You can buy GBL on Solana-based decentralized exchanges using your Phantom wallet. Check our official links for the verified contract address.";
    } else {
        answer = "GBL AI Beta currently answers questions about the project. More intelligent AI features are coming soon.";
    }

    document.getElementById("answer").innerHTML = answer;
}

function quickQuestion(q){
    document.getElementById("question").value = q;
    askAI();
}
</script>

</body>
</html>
